repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast
        name: Check Python syntax (AST)
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # Ruff - fast Python linter (syntax errors, undefined names, etc.)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: ["--select", "E9,F63,F7,F82", "--no-fix"]
        name: Ruff (fatal errors only)

  # Verify critical files parse correctly
  - repo: local
    hooks:
      - id: verify-critical-files
        name: Verify server.py and refresh.py parse
        entry: python scripts/verify_python.py
        language: python
        always_run: true
        pass_filenames: false
