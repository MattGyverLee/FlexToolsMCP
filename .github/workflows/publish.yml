name: Publish to PyPI

# Publishes the package to PyPI when a version tag is pushed (e.g. v2.3.1).
# Uses PyPI Trusted Publishing (OIDC): no API token is stored in the repo.
#
# One-time PyPI setup (see RELEASING.md):
#   https://pypi.org/manage/project/flextools-mcp/settings/publishing/
#   Add a trusted publisher:
#     Owner:        MattGyverLee
#     Repository:   FlexToolsMCP
#     Workflow:     publish.yml
#     Environment:  pypi
#   For the very first release (project not created yet), add a
#   "pending publisher" at https://pypi.org/manage/account/publishing/ instead.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}   # allow manual runs from the Actions tab

jobs:
  test:
    name: Full test matrix
    # py3.10/3.12 x mcp 1.27.0/latest.  Push/PR CI runs only the py3.12 /
    # latest cell for speed, so this is where the other three cells gate a
    # release.
    uses: ./.github/workflows/test.yml
    with:
      full_matrix: true

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Check metadata
        run: |
          python -m pip install --upgrade twine
          python -m twine check dist/*

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  smoke:
    name: Wheel install smoke test
    # Releases 2.3.1-2.9.0 all shipped un-importable (mcp 2.0.0 removed the
    # low-level Server.list_tools()/call_tool() decorators; see
    # specs/mcp2-compat/). `twine check` only validates metadata/packaging,
    # not that the wheel actually imports for a real end user, so nothing in
    # the `build` job would have caught it. This job installs the just-built
    # wheel into a completely fresh venv -- no repo checkout, no editable
    # install, no conftest.py sys.path shims -- and exercises the exact lazy
    # loader + decorator registration seam that broke, reproducing real user
    # dependency resolution instead of the repo's dev environment.
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install built wheel into a fresh venv
        shell: pwsh
        run: |
          python -m venv smoke-venv
          $wheel = Get-ChildItem -Path dist -Filter *.whl | Select-Object -First 1
          smoke-venv\Scripts\python.exe -m pip install --upgrade pip
          smoke-venv\Scripts\python.exe -m pip install $wheel.FullName

      - name: Smoke test import + list_tools() from outside the repo
        shell: pwsh
        run: |
          $smokeDir = Join-Path $env:RUNNER_TEMP "flextools-smoke"
          New-Item -ItemType Directory -Force -Path $smokeDir | Out-Null
          Push-Location $smokeDir
          $smokePy = "$env:GITHUB_WORKSPACE\smoke-venv\Scripts\python.exe"
          $smokeCheck = "import asyncio; from flextoolsmcp.server import APIIndex, list_tools; ts = asyncio.run(list_tools()); print(len(ts)); assert len(ts) >= 10"
          # Resolved mcp (2.x today). PowerShell does NOT stop on a failing
          # native process, so check $LASTEXITCODE immediately -- otherwise a
          # failed 2.x check followed by a passing 1.x check would still
          # publish a broken wheel.
          & $smokePy -c $smokeCheck
          if ($LASTEXITCODE -ne 0) { throw "Smoke test failed under resolved MCP" }
          # ... then the oldest supported 1.x floor (issue #83 dual support).
          & $smokePy -m pip install "mcp==1.27.0"
          if ($LASTEXITCODE -ne 0) { throw "MCP floor downgrade failed" }
          & $smokePy -c $smokeCheck
          if ($LASTEXITCODE -ne 0) { throw "Smoke test failed under MCP 1.27.0 floor" }
          Pop-Location

  publish:
    name: Publish to PyPI
    needs: [test, build, smoke]
    runs-on: ubuntu-latest
    # The environment must match the trusted-publisher config on PyPI.
    environment:
      name: pypi
      url: https://pypi.org/project/flextools-mcp/
    permissions:
      id-token: write   # required for OIDC Trusted Publishing
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
