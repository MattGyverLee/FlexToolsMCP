repos:
  # Standard pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast
        name: Check Python syntax (AST)
      - id: check-yaml
      # - id: end-of-file-fixer  # Disabled: causing file thrash with JSON indexes
      - id: trailing-whitespace
        # Byte-exact log evidence: the parity corpus reproduces the sha256 and
        # byte count recorded in user-logs, and two of those modules contain
        # trailing whitespace that the hash includes. Trimming them silently
        # invalidates the evidence -- verify with
        # specs/vanilla-flextools-parity/evidence/corpus/regenerate.py --check
        exclude: ^specs/.*/evidence/corpus/.*\.py\.txt$

  # Ruff - fast Python linter (syntax errors, undefined names, etc.)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.10
    hooks:
      - id: ruff
        args: ["--select", "E9,F63,F7,F82", "--no-fix"]
        name: Ruff (fatal errors only)

  # Verify src/ files: syntax + import guards for dual-mode compatibility
  - repo: local
    hooks:
      - id: verify-src-imports
        name: Verify src/ imports (dual-mode safe)
        entry: python scripts/verify_python.py
        language: python
        always_run: true
        pass_filenames: false

      - id: check-flexicon-ops
        name: Check Flexicon Operations classes load
        entry: python scripts/check_flexicon_ops.py
        language: python
        always_run: true
        pass_filenames: false

      # Check the code that lives inside TEXT -- markdown fences, templates,
      # recipe/worked-example code strings, see_also references. pyright only
      # sees src/; a stale API name in CLAUDE.md is invisible to it and gets
      # re-injected into every script Claude generates. Upstream pyflexicon
      # docstring findings are reported by the script but never block.
      - id: check-doc-snippets
        name: Check code embedded in docs against the flexicon index
        entry: python scripts/check_doc_snippets.py
        # `system`, not `python`: the check needs the project environment
        # (flextoolsmcp + installed pyflexicon) to know the real accessor and
        # symbol universe. In pre-commit's isolated venv it would see a
        # narrowed index and fail on names that are perfectly valid -- it now
        # refuses (exit 2) rather than lie, but `system` is what lets it
        # actually run.
        language: system
        always_run: true
        pass_filenames: false
