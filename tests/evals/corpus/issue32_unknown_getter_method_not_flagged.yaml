notes: >
  Regression for issue #32: when a class IS in the API index but the called
  method is NOT (e.g. a newly-added getter that hasn't been re-indexed),
  certify_script_readonly() used to conservatively classify it as mutating.
  The read-only prefix allowlist (Get/Find/Is/Has/Count/Contains) now
  classifies GetHeadwordAndCategory as read-only even though it is absent
  from the (fake, in this runner) index's LexEntryOperations method list.
issue: 32
