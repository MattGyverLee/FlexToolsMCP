[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flextools-mcp"
dynamic = ["version"]
description = "MCP server that gives AI assistants searchable LibLCM / FlexLibs / Flexicon API docs for writing FLExTools scripts."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Matthew Lee", email = "matthew_lee@sil.org" }]
keywords = ["mcp", "fieldworks", "flextools", "flexlibs", "flexicon", "liblcm", "linguistics", "lexicon"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]

# Runtime dependencies. FLExTools/FieldWorks require Windows + .NET, so the
# .NET interop (pythonnet) and semantic-search stack ship as core deps rather
# than optional extras -- there is no lightweight cross-platform install to
# protect. Mirrors requirements.txt.
dependencies = [
    "mcp>=1.27.0",
    "anyio>=4.5",
    "httpx>=0.27.1",
    "typing-inspection>=0.4.1",
    "sentence-transformers>=2.2.0",
    "faiss-cpu>=1.7.4",
    "pythonnet>=3.0.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    # The deep FieldWorks wrapper the server generates scripts against. A floor
    # (not a pin) so upgrading FLExToolsMCP re-resolves to the latest Flexicon.
    "pyflexicon>=4.2.0,<5",
    # The shallow/stable FieldWorks wrapper (cdfarrow/flexlibs). Small, and its
    # only dependency (pythonnet) is already required, so we ship it too: this
    # guarantees an exact-version flexlibs index out of the box (matching the
    # bundled flexlibs_api_v1.2.8) and lets the runtime `--flexlibs-only` refresh
    # regenerate when the installed flexlibs drifts from what shipped. Floor at
    # the indexed version; cap at the next major.
    "flexlibs>=1.2.8,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.4.0",
    "pre-commit>=4.0.0",
    # Eval harness (issue #51): tests/evals/corpus/*.yaml + tests/evals/tasks/*.yaml.
    # Already present transitively via other deps in most environments, but the
    # corpus loader imports it directly so it must be an explicit dev dep.
    "pyyaml>=6.0",
]

[project.urls]
Homepage = "https://github.com/MattGyverLee/FlexToolsMCP"
Repository = "https://github.com/MattGyverLee/FlexToolsMCP"
Issues = "https://github.com/MattGyverLee/FlexToolsMCP/issues"

# Two console-script names: `flextoolsmcp` matches the distribution so
# `uvx flextoolsmcp` works with no --from, and `flextools-mcp` is the readable
# hyphenated alias. Both launch the stdio MCP server.
[project.scripts]
flextoolsmcp = "flextoolsmcp.server:run"
flextools-mcp = "flextoolsmcp.server:run"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

# The indexed API documentation and the FlexTools module templates are bundled
# as package data so they are available after `pip install` / `uvx` with no
# separate download. (Templates back flextools_get_module_template; without this
# they are absent from the wheel and the tool 500s -- see issue #77.)
[tool.setuptools.package-data]
flextoolsmcp = ["index/**/*", "templates/**/*", "VERSION", "py.typed"]

# Archived old index versions are kept in the repo for local diffing but must
# not bloat the installed wheel. The `index/**/*` glob above would otherwise
# sweep them in; MANIFEST.in `prune` only trims the sdist, so exclude them from
# the wheel's package data here too. Covers the top-level index/archive/ and
# per-library archives (index/liblcm/archive/, index/python/archive/).
[tool.setuptools.exclude-package-data]
flextoolsmcp = ["index/archive/**", "index/**/archive/**"]

# Non-package demonstration/example code is excluded from linting: the FlexTools
# module templates intentionally show unused imports (they are copy-paste
# starting points), and the root example scripts / .claude helpers are not part
# of the shipped package. (Issue #68.)
[tool.ruff]
extend-exclude = [
    ".claude",
    "CleanUpGlosses.py",
    "test_casting_detection.py",
    "src/flextoolsmcp/templates",
]

# Lint-widening step 1 (issue #67): full F (pyflakes) + E4/E7 on top of the
# fatal-only floor. E9/F63/F7/F82 remain a subset, so pre-commit's fatal-only
# gate still matches. Bugbear (B) is deferred to step 2.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# __init__.py modules re-export the package's public API for backward-compat
# imports; the "unused" imports are the exports (some lazy-loaded, so not all
# are listed in __all__). See src/flextoolsmcp/server/__init__.py.
"**/__init__.py" = ["F401"]
# server.py deliberately orders some imports after runtime setup (lazy-import
# ordering); E402 there is intentional, not a defect. (Issue #68 note.)
"src/flextoolsmcp/server.py" = ["E402"]
# execution.py imports response-key constants after its dual-mode (package vs
# script) try/except import blocks; ruff counts those blocks as code, so the
# later import trips E402. The ordering is required by the dual-import pattern.
"src/flextoolsmcp/server/handlers/execution.py" = ["E402"]
# Test modules favor readable intent over these style rules: lambda stubs
# (E731), single-letter loop vars (E741), sys.path setup before imports (E402),
# compact setup one-liners (E702), and scratch/scaffolding locals (F841).
"tests/**" = ["E402", "E702", "E731", "E741", "F841"]
