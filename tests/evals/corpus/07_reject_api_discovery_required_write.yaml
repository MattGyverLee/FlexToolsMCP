intent: "Run a write-enabled module before any API discovery has happened"
api_mode: flexicon
write_enabled: true
code: |
  from flexicon import LexEntryOperations

  def Main(project, report, modifyAllowed):
      entries = LexEntryOperations(project).GetAll()
      report.Info("count")

  docs = {"FTM_Name": "x", "FTM_Synopsis": "x", "FTM_ModifiesDB": False, "FTM_Description": "x"}
  FlexToolsModule = FlexToolsModuleClass(Main, docs)
expect:
  outcome: preflight_reject
  error_code: api_discovery_required
  auto_fixes: 0
notes: >
  The hard WRITE-path discovery gate fires purely on `write_enabled=True`
  with zero `session.discovered_apis`, independent of whether the submitted
  code itself contains any mutation -- write isolation is unconditional.
